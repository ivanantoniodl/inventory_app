<form id="form-nuevo-derivado" method="post" data-medida="{{ medida.id }}">
  {% csrf_token %}

  <div class="mb-3">
    {{ form.derivado.label_tag }}
    {{ form.derivado }}
  </div>

  <div class="mb-3">
    {{ form.factorconversion.label_tag }}
    {{ form.factorconversion }}
  </div>

  <div class="mt-3">
    <button type="submit" class="btn btn-success">Guardar</button>
    <button type="button" class="btn btn-secondary" id="btn-volver">Volver</button>
  </div>
</form>
